name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  app:
    name: Lint & Test — /app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          # Le lock file est à la racine car on utilise npm workspaces
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check
        working-directory: app

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: app

      - name: Tests (Jest)
        run: npm test
        working-directory: app
