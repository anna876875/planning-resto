spring.application.name=restaurant-solver
server.port=8080

# Timefold — 5s pour la génération interactive, 30s pour l'optimisation approfondie
timefold.solver.termination.spent-limit=5s

# Jackson — dates en ISO-8601 (pas de timestamps)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
